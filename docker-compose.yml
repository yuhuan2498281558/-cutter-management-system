version: "3.8"

services:
  daoju-web:
    container_name: daoju-web
    ports:
      - "18080:8080"
    build:
      context: ./
      dockerfile: ./docker_env/web/Dockerfile
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./docker_env/nginx/my.conf:/etc/nginx/conf.d/my.conf
      - ./backend/media:/backend/media
    restart: always
    depends_on:
      - daoju-django
    networks:
      - daoju-network

  daoju-django:
    build:
      context: .
      dockerfile: ./docker_env/django/Dockerfile
    container_name: daoju-django
    working_dir: /backend
    depends_on:
      - daoju-redis
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_ENGINE: django.db.backends.postgresql_psycopg2
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: daoju-redis
      REDIS_PORT: 6379
      TZ: Asia/Shanghai
    volumes:
      - ./backend:/backend
      - ./logs/log:/var/log
    ports:
      - "127.0.0.1:18000:8000"
    restart: always
    networks:
      - daoju-network

  daoju-celery:
    build:
      context: .
      dockerfile: ./docker_env/celery/Dockerfile
    container_name: daoju-celery
    working_dir: /backend
    depends_on:
      - daoju-redis
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_ENGINE: django.db.backends.postgresql_psycopg2
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: daoju-redis
      REDIS_PORT: 6379
      TZ: Asia/Shanghai
    volumes:
      - ./backend:/backend
      - ./logs/log:/var/log
    restart: always
    networks:
      - daoju-network

  daoju-redis:
    image: redis:6.2.6-alpine
    container_name: daoju-redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - ./docker_env/redis/data:/data
      - ./docker_env/redis/redis.conf:/etc/redis/redis.conf
    expose:
      - "6379"
    sysctls:
      - net.core.somaxconn=1024
    command: /bin/sh -c "echo 'vm.overcommit_memory = 1' >> /etc/sysctl.conf && redis-server /etc/redis/redis.conf --appendonly yes --requirepass $${REDIS_PASSWORD}"
    privileged: true
    networks:
      - daoju-network

networks:
  daoju-network:
    name: daoju-network
