<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --sky-top: #3d7eb8;
      --sky-mid: #8ec6e6;
      --sky-horizon: #f7d7a1;
      --sea-deep: #1f5f78;
      --sea-light: #3e8ea6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #1b3d52;
      color: #214054;
      font-family: "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100%;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100vh * 1200 / 675));
      height: min(100vh, calc(100vw * 675 / 1200));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      overflow: hidden;
      background: #3d7eb8;
    }

    .caption {
      position: absolute;
      left: 28px;
      top: 22px;
      z-index: 2;
      pointer-events: none;
      text-shadow: 0 2px 12px rgba(32, 70, 96, 0.25);
    }

    .caption h1 {
      margin: 0;
      font-family: "ZCOOL XiaoWei", "Songti SC", "STSong", serif;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 400;
      letter-spacing: 0.12em;
      color: #fffdf6;
    }

    .caption p {
      margin: 6px 0 0;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: rgba(255, 252, 245, 0.88);
    }

    .hint {
      position: absolute;
      right: 22px;
      bottom: 16px;
      z-index: 2;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: rgba(255, 252, 245, 0.75);
      pointer-events: none;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .sun-glow {
      transform-box: fill-box;
      transform-origin: center;
      animation: glow 4.5s ease-in-out infinite;
    }

    .cloud {
      animation: drift 42s linear infinite;
    }

    .cloud-slow {
      animation-duration: 64s;
    }

    .cloud-fast {
      animation-duration: 28s;
    }

    .wave-a {
      animation: tide 9s linear infinite;
    }

    .wave-b {
      animation: tide 13s linear infinite reverse;
    }

    .wave-c {
      animation: tide 7s linear infinite;
    }

    .gull {
      animation: gull 11s ease-in-out infinite;
    }

    .road-scroll {
      animation: road 0.55s linear infinite;
    }

    .grass {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: sway 3.2s ease-in-out infinite;
    }

    .grass-b {
      animation-duration: 4.1s;
      animation-delay: -1.2s;
    }

    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.5s linear infinite;
    }

    .chainring-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 1.05s linear infinite;
    }

    .ride-bob {
      animation: bob 0.52s ease-in-out infinite;
    }

    .neck-bob {
      transform-box: fill-box;
      transform-origin: 20% 90%;
      animation: nod 1.05s ease-in-out infinite;
    }

    .wing-balance {
      transform-box: fill-box;
      transform-origin: 85% 45%;
      animation: flap 1.05s ease-in-out infinite;
    }

    .pouch {
      transform-box: fill-box;
      transform-origin: 20% 15%;
      animation: jiggle 1.05s ease-in-out infinite;
    }

    .fish-tail {
      transform-box: fill-box;
      transform-origin: left center;
      animation: wiggle 0.45s ease-in-out infinite;
    }

    .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5.5s steps(1, end) infinite;
    }

    .shadow {
      transform-box: fill-box;
      transform-origin: center;
      animation: squash 0.52s ease-in-out infinite;
    }

    .paused * {
      animation-play-state: paused !important;
    }

    @keyframes glow {
      0%,
      100% { opacity: 0.55; }
      50% { opacity: 0.9; }
    }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-1200px); }
    }

    @keyframes tide {
      from { transform: translateX(0); }
      to { transform: translateX(-180px); }
    }

    @keyframes gull {
      0%,
      100% { transform: translate(0, 0); }
      50% { transform: translate(36px, -14px); }
    }

    @keyframes road {
      from { transform: translateX(0); }
      to { transform: translateX(-90px); }
    }

    @keyframes sway {
      0%,
      100% { transform: rotate(-4deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes bob {
      0%,
      100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes nod {
      0%,
      100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes flap {
      0%,
      100% { transform: rotate(0deg); }
      50% { transform: rotate(-11deg); }
    }

    @keyframes jiggle {
      0%,
      100% { transform: scale(1, 1); }
      50% { transform: scale(1.04, 0.93); }
    }

    @keyframes wiggle {
      0%,
      100% { transform: rotate(-8deg); }
      50% { transform: rotate(14deg); }
    }

    @keyframes blink {
      0%,
      92%,
      100% { transform: scaleY(1); }
      94%,
      96% { transform: scaleY(0.1); }
    }

    @keyframes squash {
      0%,
      100% { transform: scaleX(1); opacity: 0.28; }
      50% { transform: scaleX(0.9); opacity: 0.18; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>

  <script>
    (function () {
      const CRANK = { x: 445, y: 478 };
      const RADIUS = 28;
      const HIPS = {
        far: { x: 404, y: 386 },
        near: { x: 418, y: 390 },
      };
      const UPPER = 52;
      const LOWER = 50;
      const PERIOD = 1050;

      const crankA = document.getElementById("crank-arm-a");
      const crankB = document.getElementById("crank-arm-b");
      const pedalA = document.getElementById("pedal-a");
      const pedalB = document.getElementById("pedal-b");
      const farUpper = document.getElementById("far-upper");
      const farLower = document.getElementById("far-lower");
      const nearUpper = document.getElementById("near-upper");
      const nearLower = document.getElementById("near-lower");
      const farFoot = document.getElementById("far-foot");
      const nearFoot = document.getElementById("near-foot");
      const stage = document.getElementById("stage");
      const hint = document.getElementById("hint");

      function pedalPoint(angle) {
        return {
          x: CRANK.x + Math.sin(angle) * RADIUS,
          y: CRANK.y + Math.cos(angle) * RADIUS,
        };
      }

      function ik(hip, target, flip) {
        let dx = target.x - hip.x;
        let dy = target.y - hip.y;
        let dist = Math.hypot(dx, dy);
        const max = UPPER + LOWER - 0.8;
        if (dist > max) {
          dx = (dx / dist) * max;
          dy = (dy / dist) * max;
          dist = max;
        }
        const base = Math.atan2(dy, dx);
        const cosA = (UPPER * UPPER + dist * dist - LOWER * LOWER) / (2 * UPPER * dist);
        const bend = Math.acos(Math.min(1, Math.max(-1, cosA)));
        const kneeAngle = base + (flip ? bend : -bend);
        return {
          x: hip.x + Math.cos(kneeAngle) * UPPER,
          y: hip.y + Math.sin(kneeAngle) * UPPER,
        };
      }

      function setLine(line, a, b) {
        line.setAttribute("x1", a.x.toFixed(2));
        line.setAttribute("y1", a.y.toFixed(2));
        line.setAttribute("x2", b.x.toFixed(2));
        line.setAttribute("y2", b.y.toFixed(2));
      }

      function setFoot(el, point, angle) {
        el.setAttribute("cx", point.x.toFixed(2));
        el.setAttribute("cy", (point.y + 4).toFixed(2));
        el.setAttribute(
          "transform",
          "rotate(" + ((angle * 180) / Math.PI).toFixed(2) + " " + point.x.toFixed(2) + " " + (point.y + 4).toFixed(2) + ")"
        );
      }

      let playing = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let start = performance.now();
      let pausedAt = 0;

      function frame(now) {
        if (!playing) {
          requestAnimationFrame(frame);
          return;
        }
        const t = now - start;
        const angle = (t / PERIOD) * Math.PI * 2;
        const a = pedalPoint(angle);
        const b = pedalPoint(angle + Math.PI);

        crankA.setAttribute("x2", a.x.toFixed(2));
        crankA.setAttribute("y2", a.y.toFixed(2));
        crankB.setAttribute("x2", b.x.toFixed(2));
        crankB.setAttribute("y2", b.y.toFixed(2));
        pedalA.setAttribute("x", (a.x - 12).toFixed(2));
        pedalA.setAttribute("y", (a.y - 3).toFixed(2));
        pedalB.setAttribute("x", (b.x - 12).toFixed(2));
        pedalB.setAttribute("y", (b.y - 3).toFixed(2));

        const farKnee = ik(HIPS.far, a, true);
        const nearKnee = ik(HIPS.near, b, false);
        setLine(farUpper, HIPS.far, farKnee);
        setLine(farLower, farKnee, a);
        setLine(nearUpper, HIPS.near, nearKnee);
        setLine(nearLower, nearKnee, b);
        setFoot(farFoot, a, angle);
        setFoot(nearFoot, b, angle + Math.PI);

        requestAnimationFrame(frame);
      }

      stage.addEventListener("click", function () {
        playing = !playing;
        stage.classList.toggle("paused", !playing);
        if (playing) {
          start += performance.now() - pausedAt;
          hint.textContent = "点击画面可暂停 / 继续";
        } else {
          pausedAt = performance.now();
          hint.textContent = "已暂停 · 再次点击仍可继续";
        }
      });

      if (playing) {
        requestAnimationFrame(frame);
      } else {
        stage.classList.add("paused");
        hint.textContent = "系统已减少动态效果 · 点击可播放";
        const a = pedalPoint(0);
        const b = pedalPoint(Math.PI);
        const farKnee = ik(HIPS.far, a, true);
        const nearKnee = ik(HIPS.near, b, false);
        setLine(farUpper, HIPS.far, farKnee);
        setLine(farLower, farKnee, a);
        setLine(nearUpper, HIPS.near, nearKnee);
        setLine(nearLower, nearKnee, b);
        stage.addEventListener(
          "click",
          function onFirst() {
            requestAnimationFrame(frame);
            stage.removeEventListener("click", onFirst);
          },
          { once: true }
        );
      }
    })();
  </script>
