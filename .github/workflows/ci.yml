name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: daoju
          POSTGRES_USER: daoju
          POSTGRES_PASSWORD: daoju
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daoju -d daoju"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Django system check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: 'true'
          DATABASE_NAME: daoju
          DATABASE_USER: daoju
          DATABASE_PASSWORD: daoju
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
        run: python manage.py check
      - name: Shield tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: 'true'
          DATABASE_NAME: daoju
          DATABASE_USER: daoju
          DATABASE_PASSWORD: daoju
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
        run: python manage.py test application.shield.tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check patch whitespace
        run: git diff --check
